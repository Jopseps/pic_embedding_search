[project]
name = "picsearch"
version = "0.1.0"
description = "Local offline semantic photo search sidecar"
# PLAN.md verified torch + CUDA 13 wheels resolve here. 3.12/3.13 also work if
# a dep regresses — drop this pin rather than vendoring a workaround.
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "platformdirs>=4.3",
    "numpy>=2.1",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "torch>=2.5",
    "transformers>=4.49",
    "sentencepiece>=0.2",
    "protobuf>=5.28",
    "watchdog>=6.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4",
    "onnxruntime-gpu>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["picsearch"]

# CUDA wheels. Falls back to CPU torch automatically on machines without them.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

# `ruff check` only. DO NOT add `ruff format` or a [tool.ruff.format] section:
# the mandated style in CLAUDE.md writes `if(cond):`, and ruff's formatter
# strips those parens with no option to preserve them. Same reason there is no
# Prettier in this repo. Lint is the gate; formatting is by hand.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E271/E275: `if(cond):` reads as a keyword missing whitespace to ruff.
ignore = ["E271", "E275", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
