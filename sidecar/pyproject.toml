[project]
name = "picsearch"
version = "1.0.2"
description = "Local offline semantic photo search sidecar"
# PLAN.md verified torch + CUDA 13 wheels resolve here. 3.12/3.13 also work if
# a dep regresses — drop this pin rather than vendoring a workaround.
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "platformdirs>=4.3",
    "numpy>=2.1",
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "transformers>=4.49",
    "sentencepiece>=0.2",
    "protobuf>=5.28",
    "watchdog>=6.0",
    "send2trash>=1.8",
    # send2trash only uses the Recycle Bin API that refuses to delete for good
    # when this is importable; without it Windows falls back to a call that
    # deletes permanently if the bin cannot take the file.
    "pywin32>=306; sys_platform == 'win32'",
]

# The default OCR engine is tesseract, which is a system binary and needs no
# wheel at all — this extra is only for people who want RapidOCR in the engine
# dropdown. No onnxruntime-gpu here: it and the CPU onnxruntime that
# rapidocr-onnxruntime pulls in both install as the `onnxruntime` package, so
# having both is last-write-wins, and screenshot OCR does not need a GPU.
[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4",
]

# torch lives in two mutually exclusive groups rather than in `dependencies`,
# because which build a machine wants depends on its GPU and one lockfile has
# to serve both. The packaged app picks one on first run (`--group cu130` when
# `nvidia-smi` answers, `--group cpu` otherwise) with `--no-default-groups`;
# a plain `uv sync` in a checkout takes `default-groups` and stays on CUDA, so
# the dev workflow did not change.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]
cpu = ["torch>=2.5"]
cu130 = ["torch>=2.5"]

[tool.uv]
default-groups = ["dev", "cu130"]
conflicts = [[{ group = "cpu" }, { group = "cu130" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["picsearch"]

# CUDA wheels on Linux and Windows. Everywhere else — and in the `cpu` group —
# torch comes from its CPU index: the PyPI Linux wheel drags in ~3 GB of CUDA
# libraries that a machine without an NVIDIA card would download for nothing.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# `ruff check` only. DO NOT add `ruff format` or a [tool.ruff.format] section:
# the mandated style in CLAUDE.md writes `if(cond):`, and ruff's formatter
# strips those parens with no option to preserve them. Same reason there is no
# Prettier in this repo. Lint is the gate; formatting is by hand.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E271/E275: `if(cond):` reads as a keyword missing whitespace to ruff.
ignore = ["E271", "E275", "B008"]

# test_v1_features.py reuses test_search's fixtures by importing them, which is
# what F811 reads as a redefinition.
[tool.ruff.lint.per-file-ignores]
"tests/test_v1_features.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
