# Push a `v*` tag and this builds every package and attaches them to a *draft*
# GitHub Release. Nothing is public until you press Publish on that draft.
#
#   Linux    .deb + .AppImage   built on Ubuntu 22.04 so the AppImage runs on
#                               any distro with glibc >= 2.35
#   Windows  NSIS setup .exe    per-user install, no admin
#   Arch     PKGBUILD           repackages the .deb; generated from
#                               packaging/arch/PKGBUILD with the real checksum
#
# The packages carry the Python *source* and a uv binary, not torch: the app
# builds its own environment on first launch (src-tauri/src/runtime.rs).
# Nothing here is code-signed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is informational until the sidecar suite has been run there once.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"

      # CPU torch: the runners have no GPU, and the cu130 wheels are 3 GB.
      - name: Sidecar tests
        working-directory: sidecar
        run: |
          uv sync --frozen --no-default-groups --group dev --group cpu
          uv run --no-sync ruff check .
          uv run --no-sync pytest -q

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Fetch the bundled uv
        run: node scripts/fetch-uv.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: PicSearch ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            **Install**

            - **Arch:** download `PKGBUILD` into an empty folder, then `makepkg -si`
            - **Debian / Ubuntu:** `sudo apt install ./PicSearch_*_amd64.deb`
            - **Any Linux:** `chmod +x PicSearch_*.AppImage` and run it. Install `tesseract` for screenshot text search.
            - **Windows:** run the `-setup.exe`. SmartScreen will warn, because the installer is not signed: *More info → Run anyway*. For screenshot text search: `winget install UB-Mannheim.TesseractOCR`.

            The first launch sets up Python, PyTorch and the search model: about 3 GB with an NVIDIA GPU, a few hundred MB without. After that the app runs fully offline.
          args: --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      # For workflow_dispatch runs, which make no release.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: bundles-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

  pkgbuild:
    name: Arch PKGBUILD
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fill in the version and the .deb checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --pattern "PicSearch_${version}_amd64.deb" --dir dist-pkg
          sum=$(sha256sum "dist-pkg/PicSearch_${version}_amd64.deb" | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=${version}/" \
              -e "s/^_deb_sha256=.*/_deb_sha256='${sum}'/" \
              packaging/arch/PKGBUILD > dist-pkg/PKGBUILD
          cat dist-pkg/PKGBUILD
          gh release upload "$TAG" dist-pkg/PKGBUILD --clobber
